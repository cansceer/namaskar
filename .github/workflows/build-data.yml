name: Build Namaskar data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - source/asana_catalog_v1.csv
      - source/asana_names_study.csv
      - tools/**
      - .github/workflows/build-data.yml

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build app JSON from GitHub-editable CSV
        run: |
          python tools/generate_asanas.py \
            --catalog source/asana_catalog_v1.csv \
            --study source/asana_names_study.csv \
            --no-local-sync

      - name: Validate app data
        run: python tools/validate_data.py

      - name: Build study export
        run: python tools/build_study_file.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/asanas.json data/study.json asanas.json study.json source/asana_names_study.generated.csv source/asana_names_study.generated.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Build Namaskar data"
            git push
          fi
